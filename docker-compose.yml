services:
  postgres:
    image: postgres:18.6
    container_name: sportgram-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sportgram
      POSTGRES_USER: sportgram
      POSTGRES_PASSWORD: sportgram
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql

  php:
    build:
      context: .
      dockerfile: infra/php/Dockerfile
    container_name: sportgram-php
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      - postgres

  nginx:
    image: nginx:1.30-alpine
    container_name: sportgram-nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/backend
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  mailer:
    image: axllent/mailpit
    container_name: sportgram-mailer
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  pg_data:
