services:
  postgres:
    image: postgres:18.6
    container_name: sportgram-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sportgram
      POSTGRES_USER: sportgram
      POSTGRES_PASSWORD: sportgram
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql

  php:
    build:
      context: .
      dockerfile: infra/php/Dockerfile
    container_name: sportgram-php
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
      - ./frontend:/var/www/frontend
    depends_on:
      - postgres

  nginx:
    image: nginx:1.30-alpine
    container_name: sportgram-nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/backend
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  nginx-tls:
    image: nginx:1.30-alpine
    profiles:
      - tls
    ports:
      - "8081:80"
      - "8443:443"
    volumes:
      - ./backend:/var/www/backend:ro
      - ./infra/nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - php

  mailer:
    image: axllent/mailpit
    container_name: sportgram-mailer
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  k6:
    image: grafana/k6:0.56.0
    profiles:
      - load
    volumes:
      - ./tests/load:/scripts:ro
    environment:
      BASE_URL: ${LOAD_TEST_BASE_URL:-http://nginx}
      LOAD_TEST_TOKEN: ${LOAD_TEST_TOKEN:-}

volumes:
  pg_data:
