name: CI / CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: 🏗️ Build and run services
        run: |
          cp backend/.env.example backend/.env
          cp frontend/.env.example frontend/.env
          docker compose up -d --build
          docker compose exec php composer install
          docker compose exec php php bin/console app:generate-app-secret
          docker compose exec php php bin/console doctrine:migrations:migrate -n
          docker compose exec  php php bin/console lexik:jwt:generate-keypair --skip-if-exists
          docker compose exec php php bin/console app:generate-vapid-keys
          cd frontend
          npm install --force
          npm run build
          npm run dev &

      - name: ⏳ Wait for services and check URLs
        run: |
          echo "Oczekiwanie na uruchomienie usług..."
          npx wait-on -t 100000 \
            http-get://localhost:8080/api/health \
            http-get://localhost:8080/api/doc.json \
            http-get://localhost:8080/api/doc \
            http-get://localhost:5173 \
            http-get://localhost:8025
          echo "Wszystkie zadeklarowane usługi działają poprawnie!"

      - name: 🧪 Run PHPUnit
        run: docker compose exec -T php vendor/bin/phpunit

      - name: 🧹 Run PHP CS Fixer
        run: docker compose exec -T php vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: 💅 Check frontend code formatting (ESLint & Prettier)
        run: |
          cd frontend
          npx eslint .
          npx prettier --check .
